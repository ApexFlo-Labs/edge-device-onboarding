name: Ubuntu script checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Check scripts without installing or flashing hardware
        run: |
          bash -n onboard-device.sh setup.sh finish-setup.sh tests/*.sh
          shellcheck onboard-device.sh setup.sh finish-setup.sh
          bash tests/test-onboard.sh ./onboard-device.sh
          bash tests/test-finish.sh ./onboard-device.sh
          bash tests/test-summary.sh ./onboard-device.sh
          python3 tests/test-errors.py ./onboard-device.sh
